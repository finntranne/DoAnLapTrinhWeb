<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">He thong shipper</title>

<meta name="viewport"
	content="width=device-width, initial-scale=1.0, user-scalable=yes" />

<link rel="preload" th:href="@{/css/adminlte.css}" as="style" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/@fontsource/source-sans-3@5.0.12/index.css"
	crossorigin="anonymous" media="print" onload="this.media='all'" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/styles/overlayscrollbars.min.css"
	crossorigin="anonymous" />
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
	crossorigin="anonymous" />
<link rel="stylesheet" th:href="@{/css/adminlte.css}" />
<link rel="stylesheet" th:href="@{/css/custom.css}" />

<th:block layout:fragment="head"></th:block>
</head>

<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">
	<div class="app-wrapper">
		<nav class="app-header navbar navbar-expand bg-body">
			<div class="container-fluid">
				<ul class="navbar-nav">
					<li class="nav-item"><a class="nav-link"
						data-lte-toggle="sidebar" href="#" role="button"> <i
							class="bi bi-list"></i>
					</a></li>
					<li class="nav-item d-none d-md-block"><a th:href="@{/}"
						class="nav-link">Home</a></li>
				</ul>
				<ul class="navbar-nav ms-auto">
					<li class="nav-item dropdown"><a class="nav-link"
						data-bs-toggle="dropdown" href="#" aria-expanded="false"> <i
							class="bi bi-bell-fill"></i> <span
							th:if="${unreadNotificationCount > 0}"
							class="navbar-badge badge text-bg-warning"
							th:text="${unreadNotificationCount}"></span>
					</a>
						<div class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
							<span class="dropdown-item dropdown-header"
								th:text="${unreadNotificationCount == 0 ? 'Khong co thong bao moi' : unreadNotificationCount + ' thong bao'}">
							</span>

							<th:block th:each="notify : ${unreadNotifications}">
								<div class="dropdown-divider"></div>
								<a
									th:with="url = ${#strings.containsIgnoreCase(notify.message, 'order') or #strings.containsIgnoreCase(notify.message, 'don hang') ? '/shipper/orders' : '/shipper/dashboard'}"
									th:href="@{${url}}" class="dropdown-item text-truncate"> <i
									class="bi bi-info-circle-fill me-2"></i> <span
									th:text="${notify.message}">Noi dung thong bao</span>
								</a>
							</th:block>

							<div class="dropdown-divider"></div>
							<a th:href="@{/shipper/dashboard}"
								class="dropdown-item dropdown-footer">Xem thong bao</a>
						</div></li>

					<li class="nav-item"><a class="nav-link" href="#"
						data-lte-toggle="fullscreen"> <i data-lte-icon="maximize"
							class="bi bi-arrows-fullscreen"></i> <i data-lte-icon="minimize"
							class="bi bi-fullscreen-exit" style="display: none"></i>
					</a></li>

					<li class="nav-item dropdown user-menu"><a href="#"
						class="nav-link dropdown-toggle" data-bs-toggle="dropdown"> <img
							th:src="@{/assets/img/user2-160x160.jpg}"
							class="user-image rounded-circle shadow" alt="User Image" /> <span
							class="d-none d-md-inline">Shipper</span>
					</a>
						<ul class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
							<li class="user-header text-bg-primary"><img
								th:src="@{/assets/img/user2-160x160.jpg}"
								class="rounded-circle shadow" alt="User Image" />
								<p>Shipper Account</p></li>
							<li class="user-footer"><a th:href="@{/user/profile}"
								class="btn btn-default btn-flat">Profile</a> <a href="#"
								id="shipperLogoutBtn" class="btn btn-default btn-flat float-end">
									Dang xuat </a></li>
						</ul></li>
				</ul>
			</div>
		</nav>

		<aside class="app-sidebar bg-body-secondary shadow"
			data-bs-theme="dark">
			<div class="sidebar-brand">
				<a th:href="@{/}" class="brand-link"> <img
					th:src="@{/images/logo.png}" alt="Alotra Logo" class="brand-image" />
					<span class="brand-text fw-light">ALOTRA</span>
				</a>
			</div>
			<div class="sidebar-wrapper">
				<nav class="mt-2">
					<ul class="nav sidebar-menu flex-column" data-lte-toggle="treeview"
						role="navigation" aria-label="Main navigation">
						<li class="nav-item"><a class="nav-link"
							th:href="@{/shipper/dashboard}"
							th:classappend="${currentUri == '/shipper/dashboard' ? 'active' : ''}">
								<i class="nav-icon bi bi-house-door-fill"></i>
								<p>Trang chu shipper</p>
						</a></li>

						<li class="nav-item"><a class="nav-link"
							th:href="@{/shipper/orders}"
							th:classappend="${currentUri == '/shipper/orders' ? 'active' : ''}">
								<i class="nav-icon bi bi-receipt-cutoff"></i>
								<p>Quan ly don hang</p>
						</a></li>
					</ul>
				</nav>
			</div>
		</aside>

		<main class="app-main p-3">
			<div layout:fragment="content"></div>
		</main>

		<footer class="app-footer">
			<div class="float-end d-none d-sm-inline">Version 1.0</div>
			<strong>Copyright &copy; 2025 <a href="https://alotra.com">AloTra</a>.
			</strong> All rights reserved.
		</footer>
	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.11.0/browser/overlayscrollbars.browser.es6.min.js"
		crossorigin="anonymous"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
	<script th:src="@{/js/adminlte.js}"></script>
	<script th:src="@{/js/logout.js}"></script>
	<th:block layout:fragment="scripts"></th:block>
</body>
</html>
