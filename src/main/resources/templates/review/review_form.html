<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::section})}">
<head>
    <title>Danh Gia San Pham</title>
</head>
<body>
<section>
    <nav class="breadcrumb-nav bg-light py-2">
        <div class="container">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chu</a></li>
                <li class="breadcrumb-item"><a th:href="@{/user/orders}" class="text-decoration-none">Lich su don hang</a></li>
                <li class="breadcrumb-item"><a th:href="@{/user/orders/{id}(id=${orderItem.order.orderID})}" class="text-decoration-none">Chi tiet DH</a></li>
                <li class="breadcrumb-item active" aria-current="page">Viet danh gia</li>
            </ol>
        </div>
    </nav>

    <div class="container my-5">
        <h1 class="fw-bold mb-4">Danh gia san pham</h1>

        <div class="row">
            <div class="col-lg-8 offset-lg-2">
                <div class="card shadow-sm mb-4">
                    <div class="card-body d-flex align-items-center">
                        <img th:src="${product.images[0].imageURL}"
                             alt="Product Image"
                             class="rounded me-3"
                             style="width: 80px; height: 80px; object-fit: cover;">
                        <div>
                            <h5 class="mb-1 fw-bold" th:text="${product.productName}">Ten san pham</h5>
                            <small class="text-muted">Size: <span th:text="${orderItem.variant.size.sizeName}"></span></small>
                            <span class="badge bg-primary ms-2">Da mua</span>
                        </div>
                    </div>
                </div>

                <div class="card shadow-lg p-4">
                    <form th:action="@{/review/save}" th:object="${review}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{orderItem.orderItemId}" />

                        <div class="star-rating">
                            <input type="radio" id="star5" th:field="*{rating}" value="5" required>
                            <label for="star5" title="5 sao"></label>

                            <input type="radio" id="star4" th:field="*{rating}" value="4">
                            <label for="star4" title="4 sao"></label>

                            <input type="radio" id="star3" th:field="*{rating}" value="3">
                            <label for="star3" title="3 sao"></label>

                            <input type="radio" id="star2" th:field="*{rating}" value="2">
                            <label for="star2" title="2 sao"></label>

                            <input type="radio" id="star1" th:field="*{rating}" value="1">
                            <label for="star1" title="1 sao"></label>
                        </div>

                        <div class="mb-4">
                            <label for="comment" class="form-label fw-bold">Nhan xet cua ban (Khong bat buoc)</label>
                            <textarea id="comment" th:field="*{comment}" rows="4" class="form-control"
                                      placeholder="Chia se cam nhan ve san pham..."></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="media" class="form-label fw-bold">Them anh hoac video (Tuy chon)</label>
                            <input type="file" id="media" name="mediaFiles" class="form-control" multiple>
                            <small class="text-muted">Toi da 3 anh/video.</small>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Gui danh gia</button>
                            <a th:href="@{/user/orders/{id}(id=${orderItem.order.orderID})}" class="btn btn-outline-secondary">Huy</a>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</section>
</body>
</html>
