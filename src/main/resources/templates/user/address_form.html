<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::title}, ~{::section})}">
<head>
    <title th:text="${pageTitle}">Quan ly dia chi</title>
</head>
<body>
<section>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="fw-bold mb-4" th:text="${pageTitle}">Them dia chi moi</h3>

                        <form th:action="@{${formAction}}" th:object="${address}" method="POST">
                            <input type="hidden" th:field="*{addressID}" />
                            <input type="hidden" name="origin" th:value="${origin}" />

                            <div class="mb-3">
                                <label for="province" class="form-label">Tinh/Thanh pho</label>
                                <input type="text" class="form-control" id="province" th:field="*{province}" required>
                            </div>

                            <div class="mb-3">
                                <label for="district" class="form-label">Quan/Huyen</label>
                                <input type="text" class="form-control" id="district" th:field="*{district}" required>
                            </div>

                            <div class="mb-3">
                                <label for="ward" class="form-label">Phuong/Xa</label>
                                <input type="text" class="form-control" id="ward" th:field="*{ward}" required>
                            </div>

                            <div class="mb-3">
                                <label for="streetAddress" class="form-label">So nha, ten duong</label>
                                <input type="text" class="form-control" id="streetAddress" th:field="*{streetAddress}"
                                       placeholder="Nhap so nha, ten duong..." required>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="isDefault" th:field="*{isDefault}">
                                <label class="form-check-label" for="isDefault">Dat lam dia chi mac dinh</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Luu dia chi</button>
                                <a th:href="@{${originUrl}}" class="btn btn-outline-secondary">Huy</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
