<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layouts/admin-layout.html}">
<head>
<meta charset="UTF-8">
<title>Chi tiết Phê duyệt Topping</title>
<style>
    .topping-image-container img {
        width: 100%;
        height: auto;
        max-height: 300px;
        object-fit: contain;
        border: 2px solid #dee2e6;
        border-radius: 12px;
        background-color: #fff;
    }
    .info-label {
        color: #6c757d;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .read-only-box {
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        padding: 12px 15px;
        border-radius: 8px;
        min-height: 48px;
        display: flex;
        align-items: center;
    }
    .price-tag {
        font-size: 1.5rem;
        color: #dc3545;
        font-weight: bold;
    }
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h1 class="h2">
				<i class="bi bi-egg-fried"></i> 
                Yêu cầu Topping #<span th:text="${approval.id}"></span>
			</h1>
			<a th:href="@{/admin/toppings/pending}" class="btn btn-outline-secondary">
				<i class="bi bi-arrow-left"></i> Quay lại danh sách
			</a>
		</div>

		<div class="alert d-flex align-items-center shadow-sm" 
             th:classappend="${approval.status.name() == 'PENDING'} ? 'alert-warning' : 
                             (${approval.status.name() == 'APPROVED'} ? 'alert-success' : 'alert-danger')">
			<i class="bi fs-4 me-3" 
               th:classappend="${approval.status.name() == 'PENDING'} ? 'bi-clock-history' : 
                               (${approval.status.name() == 'APPROVED'} ? 'bi-check-circle' : 'bi-x-circle')"></i>
			<div>
				<strong>Trạng thái: </strong>
				<span class="text-uppercase fw-bold" th:text="${approval.status}"></span>
				<span class="ms-3 text-muted">|</span>
				<span class="ms-3">
                    <i class="bi bi-lightning-charge me-1"></i> Hành động: 
                    <span class="badge bg-dark" th:text="${approval.actionType}"></span>
                </span>
			</div>
		</div>

		<div class="row mt-4">
			<div class="col-md-7">
				<div class="card mb-4 shadow-sm">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-info-circle me-2"></i>Thông tin topping bản nháp
					</div>
					<div class="card-body">
						<div class="row g-4">
							<div class="col-12">
								<label class="info-label">Tên Topping</label>
								<div class="read-only-box fw-bold fs-5" th:text="${topping.toppingName}">-</div>
							</div>
							
							<div class="col-md-6">
								<label class="info-label">Giá thêm</label>
								<div class="read-only-box price-tag">
									<span th:text="${#numbers.formatDecimal(topping.price, 0, 'COMMA', 0, 'POINT')}">0</span>₫
								</div>
							</div>

							<div class="col-md-6">
								<label class="info-label">Cửa hàng sở hữu</label>
								<div class="read-only-box">
									<i class="bi bi-shop me-2 text-primary"></i>
									<span th:text="${approval.requestedBy.shopName}">-</span>
								</div>
							</div>

                            <div class="col-12">
								<label class="info-label">Thời gian gửi yêu cầu</label>
								<div class="read-only-box">
									<i class="bi bi-calendar-event me-2"></i>
									<span th:text="${#temporals.format(approval.requestedAt, 'HH:mm - dd/MM/yyyy')}">-</span>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-md-5">
				<div class="card mb-4 shadow-sm">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-image me-2"></i>Hình ảnh minh họa
					</div>
					<div class="card-body text-center">
						<div class="topping-image-container">
                            <img th:src="${topping.imageURL != null ? topping.imageURL : '/images/default-topping.png'}" 
                                 alt="Topping Image" class="img-fluid shadow-sm">
						</div>
					</div>
				</div>

				<div class="card mb-4 shadow-sm border-primary">
					<div class="card-body">
						<label class="info-label">Thời gian gửi</label>
						<p class="fw-bold mb-3">
							<i class="bi bi-calendar3 me-2"></i>
							<span th:text="${#temporals.format(approval.requestedAt, 'HH:mm - dd/MM/yyyy')}">-</span>
						</p>
						
						<hr>

						<div th:if="${approval.status.name() == 'PENDING'}">
							<div class="d-grid gap-2">
								<form th:action="@{'/admin/toppings/approve/' + ${approval.id}}" method="post">
									<button type="submit" class="btn btn-success w-100 mb-2">
										<i class="bi bi-check-lg me-1"></i> Phê duyệt ngay
									</button>
								</form>
								<button type="button" class="btn btn-outline-danger"
									onclick="document.getElementById('rejectFormSection').classList.toggle('d-none')">
									<i class="bi bi-x-lg me-1"></i> Từ chối yêu cầu
								</button>
							</div>

							<div id="rejectFormSection" class="mt-3 d-none border-top pt-3">
								<form th:action="@{'/admin/toppings/reject/' + ${approval.id}}" method="post">
									<div class="mb-3">
										<label class="form-label small fw-bold">Lý do từ chối:</label>
										<textarea name="reason" class="form-control" rows="3" 
                                                  placeholder="Vui lòng nhập lý do để Vendor điều chỉnh..." required></textarea>
									</div>
									<button type="submit" class="btn btn-danger btn-sm w-100">Xác nhận từ chối</button>
								</form>
							</div>
						</div>

						<div th:unless="${approval.status.name() == 'PENDING'}" class="text-center py-2">
							<p class="text-muted small mb-0">Yêu cầu này đã được xử lý và không thể thay đổi.</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
