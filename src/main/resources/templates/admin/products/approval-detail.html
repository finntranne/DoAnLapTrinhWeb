<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layouts/admin-layout.html}">
<head>
<meta charset="UTF-8">
<title>Chi tiết Yêu cầu Phê duyệt</title>
<style>
    /* Custom style để đồng bộ với bản Vendor */
    .product-image-container img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border: 2px solid #dee2e6;
        border-radius: 8px;
    }
    .primary-badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #0d6efd;
        color: white;
        padding: 4px 12px;
        border-radius: 4px;
        font-size: 0.8rem;
    }
    .info-label {
        color: #6c757d;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .read-only-box {
        background-color: #f8f9fa;
        border: 1px solid #e9ecef;
        padding: 10px 15px;
        border-radius: 6px;
        min-height: 45px;
        display: flex;
        align-items: center;
    }
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h1 class="h2">
				<i class="bi bi-file-earmark-check"></i> 
                Yêu cầu Phê duyệt #<span th:text="${approval.id}"></span>
			</h1>
			<a th:href="@{/admin/products/approvals}" class="btn btn-outline-secondary">
				<i class="bi bi-arrow-left"></i> Quay lại danh sách
			</a>
		</div>

		<div class="alert d-flex align-items-center shadow-sm" 
             th:classappend="${approval.status.name() == 'PENDING'} ? 'alert-warning' : 
                             (${approval.status.name() == 'APPROVED'} ? 'alert-success' : 'alert-danger')">
			<i class="bi fs-4 me-3" 
               th:classappend="${approval.status.name() == 'PENDING'} ? 'bi-clock-history' : 
                               (${approval.status.name() == 'APPROVED'} ? 'bi-check-circle' : 'bi-x-circle')"></i>
			<div>
				<strong>Trạng thái hiện tại: </strong>
				<span class="text-uppercase fw-bold" th:text="${approval.status}"></span>
				<span class="ms-3 text-muted">|</span>
				<span class="ms-3"><i class="bi bi-tag me-1"></i> Loại: <strong th:text="${approval.actionType}"></strong></span>
			</div>
		</div>

		<div class="row mt-4">
			<div class="col-md-8">
				<div class="card mb-4 shadow-sm">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-info-circle me-2"></i>Thông tin sản phẩm bản nháp
					</div>
					<div class="card-body">
						<div class="row g-3">
							<div class="col-12">
								<label class="info-label">Tên sản phẩm</label>
								<div class="read-only-box fw-bold" th:text="${product.productName}">-</div>
							</div>
							<div class="col-md-6">
								<label class="info-label">Danh mục</label>
								<div class="read-only-box" th:text="${product.category.categoryName}">-</div>
							</div>
							<div class="col-md-6">
								<label class="info-label">Cửa hàng yêu cầu</label>
								<div class="read-only-box">
									<i class="bi bi-shop me-2"></i>
									<span th:text="${approval.requestedBy.shopName}">-</span>
								</div>
							</div>
							<div class="col-12">
								<label class="info-label">Mô tả chi tiết</label>
								<div class="read-only-box align-items-start" style="height: auto;">
									<p class="mb-0" th:text="${product.description}">-</p>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="card mb-4 shadow-sm" th:if="${not #lists.isEmpty(product.variants)}">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-list-check me-2"></i>Biến thể & Giá cả
					</div>
					<div class="card-body p-0">
						<table class="table table-hover mb-0">
							<thead class="table-light">
								<tr>
									<th class="ps-4">Kích cỡ (Size)</th>
									<th class="text-end pe-4">Giá bán (VNĐ)</th>
								</tr>
							</thead>
							<tbody>
								<tr th:each="variant : ${product.variants}">
									<td class="ps-4">
										<span class="badge bg-light text-dark border" th:text="${variant.size.sizeName}">-</span>
									</td>
									<td class="text-end pe-4 fw-bold text-danger">
										<span th:text="${#numbers.formatDecimal(variant.price, 0, 'COMMA', 0, 'POINT')}">0</span>₫
									</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>

				<div class="card mb-4 shadow-sm" th:if="${not #lists.isEmpty(product.availableToppings)}">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-cup-straw me-2"></i>Toppings đi kèm
					</div>
					<div class="card-body">
						<div class="d-flex flex-wrap gap-2">
							<div th:each="topping : ${product.availableToppings}" 
                                 class="border rounded px-3 py-2 bg-light d-flex align-items-center">
								<i class="bi bi-plus-circle-fill text-success me-2"></i>
								<span th:text="${topping.toppingName}"></span>
								<small class="ms-2 text-muted" 
                                       th:text="'(+' + ${#numbers.formatDecimal(topping.additionalPrice, 0, 'COMMA', 0, 'POINT')} + 'đ)'"></small>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="col-md-4">
				<div class="card mb-4 shadow-sm">
					<div class="card-header bg-white fw-bold">
						<i class="bi bi-image me-2"></i>Hình ảnh minh họa
					</div>
					<div class="card-body">
						<div class="row g-2">
							<div class="col-12 mb-2" th:each="image : ${existingImages}">
								
									<img th:src="${image.imageURL}" alt="Product Image">
									<span th:if="${image.isPrimary}" class="primary-badge">Ảnh chính</span>
								
							</div>
						</div>
					</div>
				</div>

				<div class="card mb-4 shadow-sm border-primary">
					<div class="card-body">
						<label class="info-label">Thời gian gửi</label>
						<p class="fw-bold mb-3">
							<i class="bi bi-calendar3 me-2"></i>
							<span th:text="${#temporals.format(approval.requestedAt, 'HH:mm - dd/MM/yyyy')}">-</span>
						</p>
						
						<hr>

						<div th:if="${approval.status.name() == 'PENDING'}">
							<div class="d-grid gap-2">
								<form th:action="@{'/admin/products/approve/' + ${approval.id}}" method="post">
									<button type="submit" class="btn btn-success w-100 mb-2">
										<i class="bi bi-check-lg me-1"></i> Phê duyệt ngay
									</button>
								</form>
								<button type="button" class="btn btn-outline-danger"
									onclick="document.getElementById('rejectFormSection').classList.toggle('d-none')">
									<i class="bi bi-x-lg me-1"></i> Từ chối yêu cầu
								</button>
							</div>

							<div id="rejectFormSection" class="mt-3 d-none border-top pt-3">
								<form th:action="@{'/admin/products/reject/' + ${approval.id}}" method="post">
									<div class="mb-3">
										<label class="form-label small fw-bold">Lý do từ chối:</label>
										<textarea name="reason" class="form-control" rows="3" 
                                                  placeholder="Vui lòng nhập lý do để Vendor điều chỉnh..." required></textarea>
									</div>
									<button type="submit" class="btn btn-danger btn-sm w-100">Xác nhận từ chối</button>
								</form>
							</div>
						</div>

						<div th:unless="${approval.status.name() == 'PENDING'}" class="text-center py-2">
							<p class="text-muted small mb-0">Yêu cầu này đã được xử lý và không thể thay đổi.</p>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
